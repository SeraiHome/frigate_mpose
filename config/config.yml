mqtt:
  host: mqtt

go2rtc:
  streams:
    # Real camera (used by detect + proxy pre-event, NOT exposed as "iphone"
    # so the web UI falls back to JSMPEG which reads from SHM with skeleton substitution)
    iphone_real:
      - rtsp://192.168.1.71:8554/live.sdp

logger:
  default: info
  logs:
    frigate.track.tracked_pose: info
    frigate.video: info
    frigate.pose_detection.integration: info
    frigate.pose_detection.base: info
    frigate.events: info
    frigate.detectors.plugins: info
    frigate.pose_detection: info
    frigate.pose_detectors: info
    frigate.pose_detectors.plugins.mediapipe_pose: info
    frigate.pose_activity_detectors.plugins.stgcn_fall: info
    frigate.track.pose_consumer: debug

# Pose detector configurations
pose_detectors:
  # mediapipe:
  #   type: mediapipe
  #   model_complexity: 2 # 0: Lite, 1: Full, 2: Heavy
  #   min_detection_confidence: 0.5
  #   min_tracking_confidence: 0.5
  #   smooth_landmarks: true
  mediapipe_task:
    type: mediapipe_task
    model_complexity: 2 # 0: Lite, 1: Full, 2: Heavy
    num_poses: 1 # Maximum number of poses to detect
    min_detection_confidence: 0.3
    min_pose_presence_confidence: 0.5
    min_tracking_confidence: 0.5
    running_mode: video # Options: "image", "video", or "live_stream"
    # model_path: /path/to/custom/model.task # Optional custom model path

    num_threads: 3 # Optional number of interpreter threads for CPU/TFLite

# Pose model configuration (for YOLO-based detectors)
pose_model:
  width: 320
  height: 320
  model_type: mediapipe_task
  input_tensor: nhwc
  input_pixel_format: rgb

cameras:
  test_camera:
    enabled: false
    ffmpeg:
      inputs:
        - path: /config/Lei2/Coffee_room_02/Videos/video_56_mjpeg.avi
          roles:
            - record
            - detect
    detect:
      enabled: false
    #   width: 720
    #   height: 480
    #   fps: 30
    #   min_initialized: 1
    # stationary:
    # interval: 100
    # threshold: 10
    # record:
    #   enabled: true
    # live:
    # stream_name: test_stream
    snapshots:
      enabled: true
      clean_copy: true
      timestamp: false
      bounding_box: true
      crop: false
      height: 175

    record:
      enabled: true
      alerts:
        retain:
          days: 1
          mode: motion
      detections:
        retain:
          days: 1
          mode: motion
    zones:
      floor:
        coordinates: 0.266,0.599,0.274,1,0.843,0.994,0.965,0.992,0.646,0.583
        loitering_time: 0
        inertia: 3
        objects: person
    review:
      detections: {}

    # Pose detection configuration

    pose:
      enabled: true
      publish_to_detected_objects: true
      privacy_mode: true
      privacy_background: scene  # "black" (solid) or "scene" (room background from motion detector)
      publish_keypoints: true
      # detector: mediapipe_task # Use the new MediaPipe Task API detector
      confidence_threshold: 0.01
      skip_frames: 0
      # keypoint_threshold: 0.3
      use_motion_roi: true
      # fps: 15 # Pose detection FPS (should be <= camera detect fps)

      # Activity detector configuration
      activity_detector:
        type: stgcn_fall
        # Use a model path that will be checked in order of existence
        model_path: 
          /workspace/frigate/frigate/pose_detection/fall_processor/models_weights/window_60_random_fps_2_le2i_montreal_clips_f1_edgetpu.tflite
        confidence_threshold: 0.5
        num_threads: 3
        effective_window_size: 40
        # accelerator: edgetpu # e.g. "edgetpu" to use Coral USB accelerator
        # device: usb # Optional device identifier passed to delegate loader

      # Actions to track

      actions:
        # - standing
        # - walking
        # - sitting
        # - lying
        - falling # New action type for fall detection
        # - waving
        # - pointing

      # Actions that trigger snapshots
      snapshot_actions:
        # - waving
        # - pointing
        - falling # Capture snapshots when falls are detected

      # Actions that trigger recording retention
      record_actions:
        # - walking
        # - running
        # - jumping
        - falling # Ensure recordings are retained when falls are detected

      # Action-specific filters
      # filters:
      # waving:
      #   min_score: 0.6
      #   threshold: 0.5
    motion:
      threshold: 48
      contour_area: 78
      improve_contrast: true

