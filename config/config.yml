  iphone:
    enabled: true
    ffmpeg:
      inputs:
        # Real source for detection via go2rtc relay (single camera connection)
        - path: rtsp://127.0.0.1:8554/iphone_real
          input_args: -rtsp_transport tcp
          roles:
            - detect
        # Privacy proxy output: read raw frames directly from proxy TCP
        - path: tcp://privacy-proxy:9000
          input_args: -f rawvideo -pix_fmt bgr24 -video_size 1280x720 -framerate 30
          roles:
            - record
      output_args:
        record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 30 -an
    detect:
      enabled: false
    snapshots:
      enabled: true
      clean_copy: true
      timestamp: false
      bounding_box: true
      crop: false
      height: 175
    record:
      enabled: true
      alerts:
        retain:
          days: 1
          mode: all
      detections:
        retain:
          days: 1
          mode: all
    pose:
      enabled: true
      publish_to_detected_objects: true
      privacy_mode: true
      privacy_background: scene
      publish_keypoints: true
      confidence_threshold: 0.1
      skip_frames: 0
      use_motion_roi: false
      activity_detector:
        type: stgcn_fall
        model_path:
          /workspace/frigate/frigate/pose_detection/fall_processor/models_weights/stgcn_window_60_le2i_montreal.tflite
        confidence_threshold: 0.5
        num_threads: 3
        effective_window_size: 40
      actions:
        - falling
      snapshot_actions:
        - falling
      record_actions:
        - falling
    motion:
      threshold: 48
      contour_area: 78
      improve_contrast: true

  rpicamera:
    # Run camera_to_v4l2.sh on the raspberry pi for the camera to work.
    # The script creates a v4l2loopback that ffmpeg seems to be needing
    enabled: false
    ffmpeg:
      inputs:
        - path: /dev/video10
            # make sure to copy the same args in camera_to_v4l2.sh
          input_args:
            - -f
            - v4l2
            - -input_format
            - yuv420p
            - -video_size
            - 640x480
            - -framerate
            - '30'
          roles:
            # - detect
            - rtmp
            # - record
      output_args:
        record: -f segment -segment_time 60 -reset_timestamps 1 -strftime 1 -c:v
          libx264 -pix_fmt yuv420p -an

