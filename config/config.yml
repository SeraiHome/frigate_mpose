mqtt:
  host: mqtt

logger:
  default: info
  logs:
    frigate.pose_detection: info
    frigate.pose_activity_detectors: info
    frigate.track.pose_processing: info

# Pose detector configurations — frame → keypoints
pose_detectors:
  mediapipe_task:
    type: mediapipe_task
    model_complexity: 2 # 0: Lite, 1: Full, 2: Heavy
    num_poses: 1
    min_detection_confidence: 0.5
    min_pose_presence_confidence: 0.5
    min_tracking_confidence: 0.5
    running_mode: video
    num_threads: 3

# Pose model metadata (frame dimensions fed to the detector)
pose_model:
  width: 320
  height: 320
  model_type: mediapipe_task
  input_tensor: nhwc
  input_pixel_format: rgb

# Optional shared activity classifier pools — for HW accelerator deployments.
#
# Each entry spawns one dedicated worker process that serves classification
# requests from any camera referencing this pool by name. This is the right
# pattern when multiple cameras need to share a single hardware accelerator
# device (e.g. one Coral USB TPU). For CPU-only deployments, per-camera
# inline classifiers (the default) are simpler, lower-latency, and allow
# concurrent inference across cameras. See docs/PLUGIN_ARCHITECTURE.md §5b.
#
# pose_activity_detectors:
#   activity_pool:
#     type: heuristic
#     confidence_threshold: 0.5

cameras:
  example_camera:
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://user:password@camera.example.com/stream
          roles:
            - detect
            - record
    detect:
      enabled: true
      fps: 5
    snapshots:
      enabled: true
    record:
      enabled: true
    motion:
      improve_contrast: true
    review:
      detections: {}

    # Pose detection runs in a dedicated per-camera worker.
    pose:
      enabled: true

      # Per-camera inline classifier (default, recommended for CPU).
      # Each camera gets its own classifier instance in its own thread.
      # TFLite releases the GIL so N cameras = N concurrent inferences.
      activity_detector:
        type: heuristic
        confidence_threshold: 0.5

      # For shared-accelerator deployments (e.g. Coral USB TPU), route
      # classifier calls into a pool instead:
      # activity_detector_pool: activity_pool

      actions:
        - standing
        - walking
        - sitting
        - lying
        - falling
      snapshot_actions:
        - falling
      record_actions:
        - falling

version: 0.17-0
